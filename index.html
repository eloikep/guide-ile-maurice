<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guide Île Maurice - Restos & Activités</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- En-tête -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <!-- Drapeau SVG Île Maurice -->
        <div class="w-8 h-6 rounded overflow-hidden flex flex-col shadow-sm border border-slate-200 shrink-0">
          <div class="h-1/4 bg-[#ea2839]"></div>
          <div class="h-1/4 bg-[#1a2061]"></div>
          <div class="h-1/4 bg-[#ffd100]"></div>
          <div class="h-1/4 bg-[#00a04d]"></div>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 leading-tight">
            Guide Île Maurice
          </h1>
          <p class="text-xs text-slate-500">Carnet d'adresses & activités partagées</p>
        </div>
      </div>

      <!-- Bascule Restos / Activités et Filtres rapides -->
      <div class="flex flex-wrap items-center gap-3 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
        <!-- Onglets -->
        <div class="flex gap-1">
          <button id="tab-restos" class="px-3 py-1.5 text-xs font-bold rounded-xl bg-sky-500 text-white shadow-sm transition">
            🍽️ Restos
          </button>
          <button id="tab-activites" class="px-3 py-1.5 text-xs font-bold rounded-xl bg-white text-slate-600 hover:bg-slate-100 transition">
            🏄 Activités
          </button>
        </div>

        <div class="h-5 w-px bg-slate-300"></div>

        <!-- Filtres dynamiques -->
        <div id="restos-filters" class="flex items-center gap-2">
          <select id="filter-type" class="px-2.5 py-1.5 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none">
            <option value="Tous">Tous types</option>
            <option value="Boui-Boui">Boui-Boui</option>
            <option value="Commun">Commun</option>
            <option value="Classe">Classe</option>
          </select>
          <select id="filter-budget" class="px-2.5 py-1.5 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none">
            <option value="Tous">Tous budgets</option>
            <option value="Economique">Économique</option>
            <option value="Normal">Normal</option>
            <option value="Cher">Cher</option>
          </select>
        </div>

        <div id="activites-filters" class="flex items-center gap-2 hidden">
          <select id="filter-activites-cat" class="px-2.5 py-1.5 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none">
            <option value="Tous">Toutes activités</option>
            <option value="Randonnée">Randonnée</option>
            <option value="Visite">Visite</option>
            <option value="Sortie">Sortie</option>
          </select>
        </div>
      </div>

      <!-- Recherche -->
      <div class="w-full md:w-64">
        <input type="text" id="search-input" placeholder="🔍 Rechercher nom, ville..." 
          class="w-full px-3.5 py-1.5 bg-slate-100 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition">
      </div>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
    
    <!-- Colonne gauche -->
    <aside class="lg:col-span-1 space-y-6">
      
      <!-- Carte des zones -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
        <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wider mb-4">🧭 Explorer par Zone</h2>
        <div id="zones-container" class="space-y-2.5"></div>
      </div>

      
      <!-- Actions de données -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
        <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wider">💾 Données</h2>
        <button id="export-json-btn" class="w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-xl transition flex items-center justify-center gap-2">
          📥 Exporter le JSON actif
        </button>
      </div>

    </aside>

    <!-- Colonne droite -->
    <section class="lg:col-span-3 space-y-8">
      
      <!-- Liste des cartes -->
      <div>
        <div id="items-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>

      <!-- Formulaire d'ajout -->
      <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
        <h2 class="text-lg font-bold text-slate-900 mb-1">✨ Proposer une nouvelle adresse / activité</h2>
        <p class="text-xs text-slate-500 mb-6">Ajoute une fiche directement dans la collection active.</p>

        <form id="add-place-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nom *</label>
            <input type="text" id="new-nom" required placeholder="Ex: Le Pouce..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Auteur *</label>
            <input type="text" id="new-auteur" required placeholder="Ex: Elo" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Zone *</label>
            <select id="new-zone" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
              <option value="Nord">Nord</option>
              <option value="Sud">Sud</option>
              <option value="Est">Est</option>
              <option value="Ouest">Ouest</option>
              <option value="Centre">Centre</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Ville *</label>
            <input type="text" id="new-ville" required placeholder="Ex: Grand Baie" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
          </div>

          <!-- Champs specifiques Restos -->
          <div id="form-restos-fields" class="contents">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Catégorie</label>
              <select id="new-categorie-resto" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                <option value="Restaurant">Restaurant</option>
                <option value="Bar">Bar</option>
                <option value="Restaurant, Bar">Restaurant & Bar</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Ambiance</label>
              <select id="new-type" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                <option value="Commun">Commun</option>
                <option value="Boui-Boui">Boui-Boui</option>
                <option value="Classe">Classe</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Budget</label>
              <select id="new-budget" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                <option value="Normal">Normal</option>
                <option value="Economique">Économique</option>
                <option value="Cher">Cher</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Cadre</label>
              <input type="text" id="new-cadre" placeholder="Vue Mer, Jardin..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
            </div>
          </div>

          <!-- Champs specifiques Activités -->
          <div id="form-activites-fields" class="contents hidden">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Sous-catégorie</label>
              <select id="new-categorie-activite" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                <option value="Randonnée">Randonnée</option>
                <option value="Visite">Visite</option>
                <option value="Sortie">Sortie</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Difficulté</label>
              <input type="text" id="new-difficulte" placeholder="Ex: 4/10" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Durée</label>
              <input type="text" id="new-duree" placeholder="Ex: 2h-3h" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Détails / Recommandations</label>
              <input type="text" id="new-details" placeholder="Point de départ, conseils..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Note (1 à 5)</label>
            <select id="new-note" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
              <option value="5">★★★★★ (5/5)</option>
              <option value="4" selected>★★★★☆ (4/5)</option>
              <option value="3">★★★☆☆ (3/5)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Lien Google Maps</label>
            <input type="url" id="new-maps" placeholder="https://maps.app.goo.gl/..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
          </div>

          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-700 mb-1">Description</label>
            <textarea id="new-description" rows="2" placeholder="Courte description..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm"></textarea>
          </div>

          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-700 mb-1">Commentaire / Astuce</label>
            <input type="text" id="new-commentaire" placeholder="Ex: Faire de bonne heure..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
          </div>

          <div class="md:col-span-2 pt-2">
            <button type="submit" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-xl transition text-sm">
              Ajouter au guide 🚀
            </button>
          </div>

        </form>
      </div>

    </section>

  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400 mt-auto">
    <p>Guide Île Maurice - Conçu pour les invités 🌴</p>
  </footer>

  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/map.js"></script>
  <script src="./assets/js/filters.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
